// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    // Pinned explicitly rather than left to resolve implicitly from the expoLibs version
    // catalog (react-native's bundled catalog default, agp 8.11.0, is incompatible with
    // Gradle 9.x). The catalog.version('agp', ...) override in settings.gradle does NOT
    // reach this bare classpath declaration - confirmed via the Gradle dependency cache on
    // disk still only ever containing 8.11.0, never the overridden version - because unlike
    // kotlinVersion/kspVersion (read via explicit ExpoRootProjectPlugin code), nothing reads
    // this one from the catalog programmatically; it relies on Gradle's implicit
    // version-from-catalog inference for unversioned dependency notation, which isn't
    // honoring the override. See mobile/android/settings.gradle for the AGP version history.
    classpath('com.android.tools.build:gradle:9.4.0')
    classpath('com.facebook.react:react-native-gradle-plugin')
    // Same unversioned-classpath risk as AGP above - pinned explicitly rather than trusting
    // implicit catalog resolution to pick up the kotlin override.
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.10')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
